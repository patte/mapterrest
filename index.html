<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mapterrest · Mapterhorn terrain in MapLibre</title>
    <style>
      :root {
        color-scheme: light;
        --panel-bg: rgba(255, 255, 255, 0.92);
        --panel-fg: #111;
        --panel-muted: #555;
        --panel-border: #ccc;
        --control-bg: #fff;
        --accent: #2b7de0;
        --edge: 12px;
      }
      body[data-theme='dark'] {
        color-scheme: dark;
        --panel-bg: rgba(20, 26, 33, 0.92);
        --panel-fg: #e8edf2;
        --panel-muted: #9aa8b6;
        --panel-border: #3a4653;
        --control-bg: #222b35;
        --accent: #66a8ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      #map {
        position: absolute;
        inset: 0;
      }

      /* The tray: exaggeration and extras on top, then shading, then basemap — the rows
         stack the way the layers render, the thing painted on top sits on top. */
      #tray {
        position: absolute;
        bottom: calc(var(--edge) + env(safe-area-inset-bottom));
        left: calc(var(--edge) + env(safe-area-inset-left));
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 9px;
        background: var(--panel-bg);
        color: var(--panel-fg);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        padding: 10px 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
        font-size: 12px;
        line-height: 1.4;
        max-width: calc(
          100vw - 2 * var(--edge) - env(safe-area-inset-left) - env(safe-area-inset-right)
        );
      }
      #tray label {
        color: var(--panel-muted);
      }
      #tray-top {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .thumbs + .row {
        margin-top: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .row input[type='checkbox'] {
        flex: none;
        margin: 0;
        cursor: pointer;
      }
      .row > label {
        cursor: pointer;
        white-space: nowrap;
      }
      .row > input:disabled,
      .row > input:disabled + label {
        cursor: default;
        opacity: 0.45;
      }
      #exposure-range {
        font-variant-numeric: tabular-nums;
      }
      input[type='range'] {
        flex: 1;
        min-width: 60px;
        margin: 0;
      }
      #exaggeration-value {
        font-variant-numeric: tabular-nums;
        min-width: 34px;
      }
      .sep {
        width: 1px;
        align-self: stretch;
        background: var(--panel-border);
        margin: 0 4px;
      }

      .thumbs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        /* Room for the selection ring, which sits just outside the preview square. */
        padding: 2px;
      }
      .tile {
        flex: none;
        width: 96px;
        padding: 0;
        border: none;
        background: none;
        color: var(--panel-muted);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font: inherit;
      }
      .tile .preview {
        position: relative;
        width: 96px;
        height: 96px;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: var(--control-bg);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tile img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .tile img:not([src]) {
        display: none;
      }
      /* The slash of a "none" tile stays legible over whatever preview lands under it. */
      .tile svg {
        position: relative;
        width: 24px;
        height: 24px;
        filter: drop-shadow(0 0 2px var(--control-bg));
      }
      .tile .caption {
        max-width: 100%;
        font-size: 10px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile[aria-pressed='true'] .preview {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-color: var(--accent);
      }
      .tile[aria-pressed='true'] .caption {
        color: var(--accent);
      }

      #hint {
        margin: 0;
        color: var(--panel-muted);
        font-size: 12px;
      }
      /* Shift+drag is a mouse gesture; on touch the hint is noise. */
      @media (hover: none) {
        #hint {
          display: none;
        }
      }
      kbd {
        font: inherit;
        font-size: 11px;
        border: 1px solid var(--panel-border);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
        background: var(--control-bg);
      }

      /* Collapsed mode — narrow screens, or forced by #collapsed=1: the tray folds
         behind a chip in its corner. The class is set from JS, one source of truth. */
      #tray-toggle {
        display: none;
        position: absolute;
        bottom: calc(var(--edge) + env(safe-area-inset-bottom));
        left: calc(var(--edge) + env(safe-area-inset-left));
        z-index: 2;
        width: 40px;
        height: 40px;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: none;
        border-radius: 10px;
        background: var(--panel-bg);
        color: var(--panel-fg);
        backdrop-filter: blur(8px);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
        cursor: pointer;
      }
      #tray-toggle svg {
        width: 20px;
        height: 20px;
      }
      body.tray-collapsed #tray-toggle {
        display: flex;
      }
      body.tray-collapsed #tray {
        bottom: calc(var(--edge) + 40px + 8px + env(safe-area-inset-bottom));
      }
      body.tray-collapsed:not(.tray-open) #tray {
        display: none;
      }

      /* MapLibre's own controls carry one light palette; these hand them the panel's.
         Its stylesheet loads after this one, so every override needs the leading `body`
         to out-specify it. */
      body .maplibregl-ctrl-group {
        background: var(--panel-bg);
        backdrop-filter: blur(8px);
      }
      body .maplibregl-ctrl-group:not(:empty) {
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      }
      body .maplibregl-ctrl-group button + button {
        border-top: 1px solid var(--panel-border);
      }
      body .maplibregl-ctrl.maplibregl-ctrl-attrib,
      body .maplibregl-ctrl-attrib.maplibregl-compact {
        background: var(--panel-bg);
        color: var(--panel-fg);
      }
      body .maplibregl-ctrl-attrib a {
        color: var(--panel-fg);
      }
      /* Both icon sets are dark SVGs baked into background-image, so there is no fill to
         recolour — inverting the sprite is what lifts them off dark chrome. */
      body[data-theme='dark'] .maplibregl-ctrl-icon,
      body[data-theme='dark'] .maplibregl-ctrl-attrib-button,
      body[data-theme='dark'] .maplibregl-ctrl-attrib.maplibregl-compact::after {
        filter: invert(1);
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <button id="tray-toggle" type="button" aria-label="controls" aria-controls="tray" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h10M18 17h2" stroke-linecap="round" />
        <circle cx="16" cy="7" r="2" />
        <circle cx="10" cy="12" r="2" />
        <circle cx="16" cy="17" r="2" />
      </svg>
    </button>

    <div id="tray">
      <div id="tray-top">
        <div class="row">
          <label for="exaggeration">exaggeration</label>
          <input id="exaggeration" type="range" min="0" max="10" step="0.1" value="1" />
          <span id="exaggeration-value">1.0×</span>
          <span class="sep"></span>
          <input id="debug-perf" type="checkbox" />
          <label for="debug-perf" title="frame-cost overlay">perf</label>
          <input id="debug-pivot" type="checkbox" />
          <label for="debug-pivot" title="pivot and grid overlay">pivot</label>
        </div>
        <p id="hint"><kbd>Shift</kbd> + drag to rotate and tilt</p>
      </div>
      <div>
        <div id="shading-thumbs" class="thumbs" role="group" aria-label="shading"></div>
        <div class="row">
          <input id="auto-exposure" type="checkbox" />
          <label for="auto-exposure">auto-exposure <span id="exposure-range"></span></label>
        </div>
      </div>
      <div id="basemap-thumbs" class="thumbs" role="group" aria-label="basemap"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
